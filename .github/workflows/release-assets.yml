name: Build and upload release assets
run-name: Build assets for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v0.1.0-demo.1
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate request and draft release
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq '[.isDraft, .isPrerelease, .tagName] | @tsv')"
          IFS=$'\t' read -r is_draft is_prerelease remote_tag <<< "$release_state"
          test "$remote_tag" = "$RELEASE_TAG"
          test "$is_draft" = "true"
          test "$is_prerelease" = "true"

      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const p = await Bun.file("package.json").json(); process.stdout.write(p.version)')"
          test "$package_version" = "$VERSION"

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun test

      - name: Configure Developer ID signing and notarization
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SIGNING_CERTIFICATE_BASE64 \
            SIGNING_CERTIFICATE_PASSWORD \
            NOTARY_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required Apple release secret is missing: $name" >&2
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/digitaldp-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/digitaldp-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "The supplied certificate is not a valid Developer ID Application identity" >&2
            exit 1
          fi

          xcrun notarytool store-credentials digitaldp-release \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path" \
            --validate

          {
            echo "DIGITALDP_MAC_SIGN_IDENTITY=$signing_identity"
            echo "DIGITALDP_MAC_NOTARY_PROFILE=digitaldp-release"
            echo "DIGITALDP_MAC_NOTARY_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build release bundles
        run: bun run release:build

      - name: Verify built bundles
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "release/DigitalDP-${VERSION}-macos-universal.zip"
            "release/DigitalDP-${VERSION}-windows-x64.zip"
            "release/DigitalDP-${VERSION}-linux-x64.tar.gz"
            "release/DigitalDP-${VERSION}-User-Guide.txt"
            "release/SHA256SUMS.txt"
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          test "$(wc -l < release/SHA256SUMS.txt | tr -d ' ')" = "4"
          (cd release && shasum -a 256 -c SHA256SUMS.txt)
          unzip -tq "release/DigitalDP-${VERSION}-macos-universal.zip"
          unzip -tq "release/DigitalDP-${VERSION}-windows-x64.zip"
          tar -tzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" >/dev/null
          extracted_mac="$RUNNER_TEMP/digitaldp-mac-verification"
          mkdir -p "$extracted_mac"
          ditto -x -k "release/DigitalDP-${VERSION}-macos-universal.zip" "$extracted_mac"
          app="$extracted_mac/DigitalDP-${VERSION}-macos-universal/DigitalDP.app"
          codesign --verify --deep --strict --all-architectures "$app"
          xcrun stapler validate -v "$app"
          spctl --assess --type execute --verbose=4 "$app"
          cmp USER_GUIDE.md "release/DigitalDP-${VERSION}-User-Guide.txt"
          unzip -p "release/DigitalDP-${VERSION}-macos-universal.zip" "DigitalDP-${VERSION}-macos-universal/USER-GUIDE.txt" | cmp USER_GUIDE.md -
          unzip -p "release/DigitalDP-${VERSION}-windows-x64.zip" "DigitalDP-${VERSION}-windows-x64/USER-GUIDE.txt" | cmp USER_GUIDE.md -
          tar -xOzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" "DigitalDP-${VERSION}-linux-x64/USER-GUIDE.txt" | cmp USER_GUIDE.md -

      - name: Preserve assets as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DigitalDP-${{ steps.meta.outputs.version }}-release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/DigitalDP-${{ steps.meta.outputs.version }}-macos-universal.zip
            release/DigitalDP-${{ steps.meta.outputs.version }}-windows-x64.zip
            release/DigitalDP-${{ steps.meta.outputs.version }}-linux-x64.tar.gz
            release/DigitalDP-${{ steps.meta.outputs.version }}-User-Guide.txt
            release/SHA256SUMS.txt

      - name: Upload bundles to the existing draft
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "release/DigitalDP-${VERSION}-macos-universal.zip" \
            "release/DigitalDP-${VERSION}-windows-x64.zip" \
            "release/DigitalDP-${VERSION}-linux-x64.tar.gz" \
            "release/DigitalDP-${VERSION}-User-Guide.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          # Replace the checksum only after all three bundle uploads succeed.
          gh release upload "$RELEASE_TAG" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify final draft assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/digitaldp-release.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName > "$release_json"

          RELEASE_JSON="$release_json" node <<'NODE'
          const { statSync, readFileSync } = require("node:fs");

          const version = process.env.VERSION;
          const tag = process.env.RELEASE_TAG;
          const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
          const expected = [
            `DigitalDP-${version}-macos-universal.zip`,
            `DigitalDP-${version}-windows-x64.zip`,
            `DigitalDP-${version}-linux-x64.tar.gz`,
            `DigitalDP-${version}-User-Guide.txt`,
            "SHA256SUMS.txt",
          ];

          if (!release.isDraft) throw new Error("Release is no longer a draft");
          if (!release.isPrerelease) throw new Error("Release is no longer marked as a prerelease");
          if (release.tagName !== tag) throw new Error(`Unexpected tag: ${release.tagName}`);
          if (release.assets.length !== expected.length) {
            throw new Error(`Expected exactly ${expected.length} assets; found ${release.assets.length}`);
          }

          for (const name of expected) {
            const asset = release.assets.find((candidate) => candidate.name === name);
            if (!asset) throw new Error(`Missing release asset: ${name}`);
            if (asset.state !== "uploaded") throw new Error(`${name} state is ${asset.state}`);
            const localSize = statSync(`release/${name}`).size;
            if (asset.size !== localSize || localSize <= 0) {
              throw new Error(`${name} size mismatch: GitHub=${asset.size}, local=${localSize}`);
            }
            console.log(`${name}: uploaded (${localSize} bytes)`);
          }
          NODE

      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/digitaldp-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/digitaldp-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
