name: Build and upload release assets
run-name: Build assets for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v0.1.0-demo.5
        type: string
      include_macos:
        description: Include macOS (requires Developer ID signing and Apple notarization secrets)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ${{ inputs.include_macos && 'macos-15-intel' || 'ubuntu-latest' }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sample_count: ${{ steps.package.outputs.sample_count }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      INCLUDE_MACOS: ${{ inputs.include_macos }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate request and draft release
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq '[.isDraft, .isPrerelease, .tagName] | @tsv')"
          IFS=$'\t' read -r is_draft is_prerelease remote_tag <<< "$release_state"
          test "$remote_tag" = "$RELEASE_TAG"
          test "$is_draft" = "true"
          test "$is_prerelease" = "true"

      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const p = await Bun.file("package.json").json(); process.stdout.write(p.version)')"
          test "$package_version" = "$VERSION"
          sample_count="$(bun -e 'import { COURSE_SAMPLE_PAPERS } from "./examples/sample-source/index.ts"; process.stdout.write(String(COURSE_SAMPLE_PAPERS.length))')"
          echo "sample_count=$sample_count" >> "$GITHUB_OUTPUT"

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun test

      - name: Configure Developer ID signing and notarization
        if: inputs.include_macos
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SIGNING_CERTIFICATE_BASE64 \
            SIGNING_CERTIFICATE_PASSWORD \
            NOTARY_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required Apple release secret is missing: $name" >&2
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/digitaldp-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/digitaldp-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "The supplied certificate is not a valid Developer ID Application identity" >&2
            exit 1
          fi

          xcrun notarytool store-credentials digitaldp-release \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path" \
            --validate

          {
            echo "DIGITALDP_MAC_SIGN_IDENTITY=$signing_identity"
            echo "DIGITALDP_MAC_NOTARY_PROFILE=digitaldp-release"
            echo "DIGITALDP_MAC_NOTARY_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build release bundles
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_MACOS" = "true" ]]; then
            bun run release:build
          else
            bun run release:build --platforms=windows-x64,linux-x64
          fi

      - name: Verify built bundles
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "release/DigitalDP-${VERSION}-windows-x64.zip"
            "release/DigitalDP-${VERSION}-linux-x64.tar.gz"
            "release/DigitalDP-${VERSION}-User-Guide.html"
            "release/DigitalDP-${VERSION}-User-Guide.txt"
            "release/DigitalDP-${VERSION}-Release-Notes.txt"
            "release/SHA256SUMS.txt"
          )
          if [[ "$INCLUDE_MACOS" = "true" ]]; then
            files+=("release/DigitalDP-${VERSION}-macos-universal.zip")
          else
            test ! -e "release/DigitalDP-${VERSION}-macos-universal.zip"
          fi
          for file in "${files[@]}"; do
            test -s "$file"
          done
          test "$(wc -l < release/SHA256SUMS.txt | tr -d ' ')" = "$((${#files[@]} - 1))"
          (cd release && shasum -a 256 -c SHA256SUMS.txt)
          unzip -tq "release/DigitalDP-${VERSION}-windows-x64.zip"
          tar -tzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" >/dev/null
          if [[ "$INCLUDE_MACOS" = "true" ]]; then
            unzip -tq "release/DigitalDP-${VERSION}-macos-universal.zip"
            extracted_mac="$RUNNER_TEMP/digitaldp-mac-verification"
            mkdir -p "$extracted_mac"
            ditto -x -k "release/DigitalDP-${VERSION}-macos-universal.zip" "$extracted_mac"
            app="$extracted_mac/DigitalDP-${VERSION}-macos-universal/DigitalDP.app"
            codesign --verify --deep --strict --all-architectures "$app"
            xcrun stapler validate -v "$app"
            spctl --assess --type execute --verbose=4 "$app"
            cmp USER_GUIDE.md "$extracted_mac/DigitalDP-${VERSION}-macos-universal/USER-GUIDE.txt"
            cmp USER_GUIDE.html "$extracted_mac/DigitalDP-${VERSION}-macos-universal/USER-GUIDE.html"
            cmp "release/RELEASE_NOTES-${VERSION}.md" "$extracted_mac/DigitalDP-${VERSION}-macos-universal/RELEASE-NOTES.txt"
          fi
          cmp USER_GUIDE.html "release/DigitalDP-${VERSION}-User-Guide.html"
          cmp USER_GUIDE.md "release/DigitalDP-${VERSION}-User-Guide.txt"
          cmp "release/RELEASE_NOTES-${VERSION}.md" "release/DigitalDP-${VERSION}-Release-Notes.txt"
          unzip -p "release/DigitalDP-${VERSION}-windows-x64.zip" "DigitalDP-${VERSION}-windows-x64/USER-GUIDE.txt" | cmp USER_GUIDE.md -
          tar -xOzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" "DigitalDP-${VERSION}-linux-x64/USER-GUIDE.txt" | cmp USER_GUIDE.md -
          unzip -p "release/DigitalDP-${VERSION}-windows-x64.zip" "DigitalDP-${VERSION}-windows-x64/USER-GUIDE.html" | cmp USER_GUIDE.html -
          tar -xOzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" "DigitalDP-${VERSION}-linux-x64/USER-GUIDE.html" | cmp USER_GUIDE.html -
          unzip -p "release/DigitalDP-${VERSION}-windows-x64.zip" "DigitalDP-${VERSION}-windows-x64/RELEASE-NOTES.txt" | cmp "release/RELEASE_NOTES-${VERSION}.md" -
          tar -xOzf "release/DigitalDP-${VERSION}-linux-x64.tar.gz" "DigitalDP-${VERSION}-linux-x64/RELEASE-NOTES.txt" | cmp "release/RELEASE_NOTES-${VERSION}.md" -

      - name: Preserve assets as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DigitalDP-${{ steps.meta.outputs.version }}-release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/DigitalDP-${{ steps.meta.outputs.version }}-macos-universal.zip
            release/DigitalDP-${{ steps.meta.outputs.version }}-windows-x64.zip
            release/DigitalDP-${{ steps.meta.outputs.version }}-linux-x64.tar.gz
            release/DigitalDP-${{ steps.meta.outputs.version }}-User-Guide.html
            release/DigitalDP-${{ steps.meta.outputs.version }}-User-Guide.txt
            release/DigitalDP-${{ steps.meta.outputs.version }}-Release-Notes.txt
            release/SHA256SUMS.txt

      - name: Upload bundles to the existing draft
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "release/DigitalDP-${VERSION}-windows-x64.zip"
            "release/DigitalDP-${VERSION}-linux-x64.tar.gz"
            "release/DigitalDP-${VERSION}-User-Guide.html"
            "release/DigitalDP-${VERSION}-User-Guide.txt"
            "release/DigitalDP-${VERSION}-Release-Notes.txt"
          )
          if [[ "$INCLUDE_MACOS" = "true" ]]; then
            files+=("release/DigitalDP-${VERSION}-macos-universal.zip")
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          # Replace the checksum only after every selected bundle upload succeeds.
          gh release upload "$RELEASE_TAG" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify final draft assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/digitaldp-release.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName > "$release_json"

          RELEASE_JSON="$release_json" node <<'NODE'
          const { statSync, readFileSync } = require("node:fs");

          const version = process.env.VERSION;
          const tag = process.env.RELEASE_TAG;
          const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
          const expected = [
            `DigitalDP-${version}-windows-x64.zip`,
            `DigitalDP-${version}-linux-x64.tar.gz`,
            `DigitalDP-${version}-User-Guide.html`,
            `DigitalDP-${version}-User-Guide.txt`,
            `DigitalDP-${version}-Release-Notes.txt`,
            "SHA256SUMS.txt",
          ];
          if (process.env.INCLUDE_MACOS === "true") expected.push(`DigitalDP-${version}-macos-universal.zip`);

          if (!release.isDraft) throw new Error("Release is no longer a draft");
          if (!release.isPrerelease) throw new Error("Release is no longer marked as a prerelease");
          if (release.tagName !== tag) throw new Error(`Unexpected tag: ${release.tagName}`);
          if (release.assets.length !== expected.length) {
            throw new Error(`Expected exactly ${expected.length} assets; found ${release.assets.length}`);
          }

          for (const name of expected) {
            const asset = release.assets.find((candidate) => candidate.name === name);
            if (!asset) throw new Error(`Missing release asset: ${name}`);
            if (asset.state !== "uploaded") throw new Error(`${name} state is ${asset.state}`);
            const localSize = statSync(`release/${name}`).size;
            if (asset.size !== localSize || localSize <= 0) {
              throw new Error(`${name} size mismatch: GitHub=${asset.size}, local=${localSize}`);
            }
            console.log(`${name}: uploaded (${localSize} bytes)`);
          }
          NODE

      - name: Remove temporary Apple credentials
        if: always() && inputs.include_macos
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/digitaldp-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/digitaldp-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  native-smoke:
    name: Native smoke (${{ matrix.platform }})
    needs: build-and-upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-and-upload.outputs.version }}
      EXPECTED_SAMPLES: ${{ needs.build-and-upload.outputs.sample_count }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Download this run's verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "DigitalDP-${VERSION}-release-assets" \
            --dir "$RUNNER_TEMP/digitaldp-assets"

      - name: Verify native startup, seeded papers, and embedded pages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { createHash } = require("node:crypto");
          const { spawn, execFileSync } = require("node:child_process");
          const { mkdtempSync, mkdirSync, readFileSync, rmSync } = require("node:fs");
          const { tmpdir } = require("node:os");
          const { join } = require("node:path");
          const { setTimeout: delay } = require("node:timers/promises");

          async function main() {
            const { VERSION: version, RELEASE_PLATFORM: platform } = process.env;
            const expectedSamples = Number(process.env.EXPECTED_SAMPLES);
            assert.ok(Number.isInteger(expectedSamples) && expectedSamples > 0);
            const assets = join(process.env.RUNNER_TEMP, "digitaldp-assets");
            const packageName = `DigitalDP-${version}-${platform}`;
            const archiveName = `${packageName}${platform === "windows-x64" ? ".zip" : ".tar.gz"}`;
            const checksums = new Map(readFileSync(join(assets, "SHA256SUMS.txt"), "utf8")
              .trim().split("\n").map((line) => line.split("  ").reverse()));
            assert.equal(createHash("sha256").update(readFileSync(join(assets, archiveName))).digest("hex"), checksums.get(archiveName));

            const smokeRoot = mkdtempSync(join(tmpdir(), "digitaldp-native-smoke-"));
            let app;
            let closed;
            let logs = "";
            try {
              const unpack = join(smokeRoot, "unpack");
              mkdirSync(unpack);
              // Git Bash's tar treats a Windows drive letter as a remote host.
              const tarCommand = process.platform === "win32"
                ? join(process.env.SystemRoot, "System32", "tar.exe") : "tar";
              execFileSync(tarCommand, ["-xf", join(assets, archiveName), "-C", unpack]);
              const packageDirectory = join(unpack, packageName);
              app = spawn(join(packageDirectory, platform === "windows-x64" ? "DigitalDP.exe" : "DigitalDP"), [], {
                cwd: smokeRoot,
                env: { ...process.env, PORT: "19148", DIGITALDP_DATA_DIR: join(smokeRoot, "data"), DIGITALDP_OPEN_BROWSER: "0" },
                stdio: ["ignore", "pipe", "pipe"],
              });
              let spawnError;
              app.on("error", (error) => { spawnError = error; });
              closed = new Promise((resolve) => app.once("close", resolve));
              app.stdout.on("data", (data) => { logs += data; });
              app.stderr.on("data", (data) => { logs += data; });
              const origin = "http://127.0.0.1:19148";
              let ready = false;
              for (let attempt = 0; attempt < 60; attempt += 1) {
                if (spawnError) throw spawnError;
                if (app.exitCode !== null || app.signalCode !== null) throw new Error(`App exited before readiness: ${app.exitCode ?? app.signalCode}`);
                try {
                  const response = await fetch(`${origin}/api/bootstrap`, { signal: AbortSignal.timeout(1000) });
                  if (response.ok) {
                    const bootstrap = await response.json();
                    assert.equal(bootstrap.setupRequired, false);
                    ready = true;
                    break;
                  }
                } catch {}
                await delay(500);
              }
              assert.ok(ready, "App did not become ready");
              const login = await fetch(`${origin}/api/login/admin`, {
                method: "POST", headers: { "Content-Type": "application/json", Origin: origin },
                body: JSON.stringify({ username: "admin", password: "admin" }),
              });
              assert.equal(login.status, 200);
              assert.equal((await login.json()).role, "admin");
              const cookie = login.headers.get("set-cookie")?.split(";")[0];
              assert.ok(cookie, "Demo sign-in must issue a session");
              const auth = { Cookie: cookie };
              const stateResponse = await fetch(`${origin}/api/admin/state`, { headers: auth });
              assert.equal(stateResponse.status, 200);
              const state = await stateResponse.json();
              assert.equal(state.papers.length, expectedSamples, "Every bundled mock must be seeded");
              assert.equal(state.classes.length, 0, "Release must not include classroom data");
              assert.equal(state.students.length, 0);
              assert.equal(state.sessions.length, 0);
              for (const path of ["/admin", "/student", "/clock", "/exam.js", "/paper-builder-drafts.js", "/admin-end-exam.js", "/response-save-state.js", "/exam-phase-model.js"]) {
                const response = await fetch(`${origin}${path}`);
                assert.equal(response.status, 200, `${path} is embedded`);
                assert.ok((await response.text()).length > 100, `${path} is not empty`);
              }
              const guide = await fetch(`${origin}/guide`);
              assert.equal(guide.status, 200);
              assert.equal(await guide.text(), readFileSync(join(packageDirectory, "USER-GUIDE.html"), "utf8"));
              for (const path of ["/api/admin/state", "/mock-guides"]) {
                assert.equal((await fetch(`${origin}${path}`)).status, 401, `${path} requires teacher authentication`);
              }
              for (const path of ["/data/digitaldp.sqlite", "/resources/private/", "/examples/sample-source/index.ts"]) {
                assert.equal((await fetch(`${origin}${path}`)).status, 404, `${path} is not public`);
              }
              assert.equal((await fetch(`${origin}/mock-guides`, { headers: auth })).status, 200);
              console.log(`${platform}: native startup, ${expectedSamples} mocks, teacher login, embedded assets, and private-route checks passed`);
            } catch (error) {
              console.error(logs);
              throw error;
            } finally {
              if (app && app.exitCode === null && app.signalCode === null) {
                app.kill();
                await Promise.race([closed, delay(3000)]);
                if (app.exitCode === null && app.signalCode === null) app.kill("SIGKILL");
                await closed;
              }
              rmSync(smokeRoot, { recursive: true, force: true });
            }
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
